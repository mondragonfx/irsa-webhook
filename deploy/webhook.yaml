apiVersion: v1
kind: Namespace
metadata:
  name: irsa-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irsa-webhook
  namespace: irsa-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: irsa-webhook
rules:
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: irsa-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: irsa-webhook
subjects:
- kind: ServiceAccount
  name: irsa-webhook
  namespace: irsa-system
---
apiVersion: v1
kind: Service
metadata:
  name: irsa-webhook
  namespace: irsa-system
spec:
  selector:
    app: irsa-webhook
  ports:
  - port: 443
    targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: irsa-webhook
  namespace: irsa-system
  labels:
    app: irsa-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: irsa-webhook
  template:
    metadata:
      labels:
        app: irsa-webhook
    spec:
      serviceAccountName: irsa-webhook
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: irsa-webhook
      containers:
      - name: webhook
        image: vultr/irsa-webhook:v0.3.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
          name: webhook
        env:
        - name: STS_ENDPOINT
          value: "https://api.vultr.com/v2/assumed-roles/compatibility/aws/sts"
        # Lifetime of the projected token injected into pods (seconds).
        - name: TOKEN_EXPIRATION_SECONDS
          value: "86400"
        - name: TLS_CERT_PATH
          value: /etc/webhook/certs/tls.crt
        - name: TLS_KEY_PATH
          value: /etc/webhook/certs/tls.key
        volumeMounts:
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
      volumes:
      - name: webhook-certs
        secret:
          secretName: irsa-webhook-certs
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: irsa-webhook
  namespace: irsa-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: irsa-webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: irsa-webhook
webhooks:
- name: irsa.vultr.com
  clientConfig:
    service:
      name: irsa-webhook
      namespace: irsa-system
      path: /mutate
    caBundle: CA_BUNDLE_PLACEHOLDER
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  admissionReviewVersions: ["v1"]
  sideEffects: None
  timeoutSeconds: 5
  # Fail closed: a pod that asked for credentials must not silently start
  # without them. The namespaceSelector below keeps the blast radius away from
  # system namespaces and from the webhook itself, so a broken webhook can
  # always be repaired.
  failurePolicy: Fail
  # Mutation is idempotent, so let the API server call us again after another
  # webhook adds containers (for example a Vault or service-mesh sidecar).
  reinvocationPolicy: IfNeeded
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: ["kube-system", "kube-node-lease", "kube-public", "irsa-system"]
    # Label a namespace irsa-webhook=disabled to opt it out entirely.
    - key: irsa-webhook
      operator: NotIn
      values: ["disabled"]
